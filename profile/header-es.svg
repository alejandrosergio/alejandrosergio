    <ellipse cx="1120" cy="180" rx="400" ry="300" fill="url(#glow)"/>
    <rect x="900" width="380" height="330" fill="url(#dots)"/>
    <g fill="none" stroke="url(#line)">
      <path d="M-50 305 C170 190 300 390 550 280 S910 240 1320 310" stroke-width="1.8"/>
      <path d="M-50 314 C210 220 350 370 620 291 S980 190 1320 270" stroke-width="1"/>
      <path d="M-50 326 C230 270 420 344 710 286 S1050 220 1320 242" stroke-width="1" stroke-dasharray="2 5"/>
      <path d="M890 75 H1040 V160 H1148 V241 H1290" stroke-width="1.5"/>
      <path d="M960 -20 V53 H1173 V135 H1300" stroke-width="1"/>
    </g>
    <g fill="url(#glass)" stroke="#39caff" stroke-opacity=".65">
      <rect x="1005" y="40" width="70" height="70" rx="12"/>
      <rect x="1115" y="125" width="92" height="92" rx="16"/>
      <rect x="963" y="225" width="48" height="48" rx="10"/>
      <rect x="1217" y="30" width="35" height="35" rx="7"/>
