      <text x="58" y="62" font-size="17" letter-spacing="5" fill="#5bdcff">SOFTWARE EMPRESARIAL</text>
      <text x="54" y="144" font-size="65" font-weight="700" letter-spacing="-1.7" fill="#f7fbff">.NET · Power Platform</text>
      <text x="58" y="195" font-size="25" fill="#d4e4f5">Full stack · Automatización · Integración de IA</text>
      <rect x="58" y="233" width="46" height="3" rx="1.5" fill="#35d2ff"/>
      <text x="120" y="242" font-size="20" letter-spacing="2" fill="#eaf4ff">Sergio Hernández</text>
