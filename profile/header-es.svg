<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">Sergio Hernández · .NET y Power Platform</title>
  <desc id="desc">Desarrollo full stack, automatización e integración de IA. Fondo azul marino con módulos conectados y ondas de datos azules.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08192e"/><stop offset=".58" stop-color="#102b4b"/><stop offset="1" stop-color="#073960"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#25d7ff" stop-opacity="0"/><stop offset=".48" stop-color="#25d7ff"/><stop offset="1" stop-color="#0078d4" stop-opacity=".15"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#40d5ff" stop-opacity=".45"/><stop offset="1" stop-color="#0078d4" stop-opacity=".06"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#008de5" stop-opacity=".3"/><stop offset="1" stop-color="#008de5" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#39caff" opacity=".18"/></pattern>
    <clipPath id="clip"><rect width="1280" height="330" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
